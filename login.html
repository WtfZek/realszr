<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 数字人系统</title>
    <link rel="stylesheet" href="static/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div class="container">
        <div class="form-container" id="login-form">
            <div class="logo-container">
                <img src="static/images/logo.png" alt="Logo" class="logo">
                <h1>数字人系统</h1>
            </div>
            
            <div class="form-group">
                <div class="input-group">
                    <i class="icon fas fa-user"></i>
                    <input type="text" id="username" placeholder="用户名" required>
                </div>
                <span class="error-message" id="username-error"></span>
            </div>
            
            <div class="form-group">
                <div class="input-group">
                    <i class="icon fas fa-lock"></i>
                    <input type="password" id="password" placeholder="密码" required>
                    <i class="toggle-password fas fa-eye-slash" id="toggle-password"></i>
                </div>
                <span class="error-message" id="password-error"></span>
            </div>
            
            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">记住我</label>
                </div>
                <a href="#" class="forgot-password">忘记密码?</a>
            </div>
            
            <button type="button" id="login-button" class="btn btn-primary">登录</button>
            
            <div class="form-footer">
                <p>还没有账号? <a href="register.html" id="goto-register">立即注册</a></p>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification">
        <i class="icon"></i>
        <span class="message"></span>
    </div>
    
    <script src="static/js/login.js"></script>
</body>
</html>
